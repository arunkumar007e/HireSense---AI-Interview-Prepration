services:
  db:
    image: postgres:16-alpine
    container_name: hiresense-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hiresense
      POSTGRES_USER: hiresense
      POSTGRES_PASSWORD: hiresense
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiresense -d hiresense"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: hiresense-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/hiresense
      DB_USERNAME: hiresense
      DB_PASSWORD: hiresense
      JWT_SECRET: ${JWT_SECRET:?Please set JWT_SECRET in the .env file (at least 32 characters)}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-604800000}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.3}
      OPENAI_MAX_TOKENS: ${OPENAI_MAX_TOKENS:-2000}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-60}
      MOCK_QUESTION_BANK_SIZE: ${MOCK_QUESTION_BANK_SIZE:-6}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@hiresense.com}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-Admin@12345}
      APP_ADMIN_NAME: ${APP_ADMIN_NAME:-HireSense Admin}
      APP_UPLOAD_DIR: /app/uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8090,http://127.0.0.1:8090}
    volumes:
      - uploads:/app/uploads
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: hiresense-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8090:80"

volumes:
  pgdata:
  uploads: